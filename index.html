<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sync Player | تزامن فوري 0ms</title>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #0a0f1c, #03060c);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }
        .container { max-width: 1000px; width: 100%; }
        .video-card {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(59,130,246,0.4);
            position: relative;
        }
        video { width: 100%; display: block; cursor: pointer; }
        .overlay-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            padding: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .video-card:hover .overlay-controls { opacity: 1; }
        button {
            background: rgba(59,130,246,0.9);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            font-size: 1rem;
        }
        button:active { transform: scale(0.96); }
        .sync-btn {
            background: linear-gradient(135deg, #2563EB, #7C3AED);
            box-shadow: 0 0 20px #3b82f6;
        }
        .upload-area {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .upload-btn {
            background: rgba(17,24,39,0.9);
            border: 1px solid #3b82f6;
            padding: 10px 20px;
        }
        .room-input {
            background: #1e293b;
            border: 1px solid #3b82f6;
            padding: 12px 16px;
            border-radius: 40px;
            color: white;
            width: 200px;
            text-align: center;
            font-family: monospace;
        }
        .status {
            margin-top: 1rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            word-break: break-all;
        }
        .time-precise {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #60A5FA;
            z-index: 10;
        }
        .peer-count {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #22c55e;
            font-family: monospace;
            z-index: 10;
        }
        @media (max-width: 600px) {
            button { padding: 8px 16px; font-size: 0.8rem; }
            .room-input { width: 160px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="video-card">
        <video id="videoPlayer" preload="metadata"></video>
        <div class="time-precise" id="preciseTime">0:00.000</div>
        <div class="peer-count" id="peerCount">👥 0 متصل</div>
        <div class="overlay-controls">
            <button id="playBtn">▶ تشغيل</button>
            <button id="pauseBtn">⏸ إيقاف</button>
            <button id="syncBtn" class="sync-btn">⚡ فوري</button>
        </div>
    </div>
    <div class="upload-area">
        <button id="uploadBtn" class="upload-btn">📁 رفع فيديو</button>
        <input type="text" id="roomIdInput" class="room-input" placeholder="معرف الغرفة" value="my-room">
        <button id="joinRoomBtn" class="upload-btn">🔗 انضمام/تحديث</button>
    </div>
    <input type="file" id="fileInput" accept="video/*" style="display:none">
    <div class="status" id="statusMsg">🟡 جاري التهيئة...</div>
</div>

<script>
    // ========== نظام WebRTC المباشر (بدون سيرفر) ==========
    let peers = new Map(); // تخزين جميع الأجهزة المتصلة
    let currentRoom = 'my-room';
    let pollingInterval = null;
    let myClientId = Math.random().toString(36).substring(2, 10);
    
    const video = document.getElementById('videoPlayer');
    const syncBtn = document.getElementById('syncBtn');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const roomIdInput = document.getElementById('roomIdInput');
    const statusDiv = document.getElementById('statusMsg');
    const preciseTimeSpan = document.getElementById('preciseTime');
    const peerCountSpan = document.getElementById('peerCount');
    
    // عرض الوقت بدقة عالية
    function updateTimeDisplay() {
        if (video.duration && !isNaN(video.duration)) {
            const current = video.currentTime;
            const mins = Math.floor(current / 60);
            const secs = (current % 60).toFixed(3);
            preciseTimeSpan.textContent = `${mins}:${secs.padStart(6, '0')}`;
        }
        requestAnimationFrame(updateTimeDisplay);
    }
    updateTimeDisplay();
    
    // ========== P2PCF: التوصيل المباشر عبر Cloudflare ==========
    // نستخدم خدمة عامة مجانية (P2PCF public worker)
    const WORKER_URL = 'https://p2pcf.gfodor.workers.dev';
    
    let p2pcf = null;
    let isSyncing = false;
    let syncTimer = null;
    
    function initP2PCF() {
        // إنشاء كائن P2PCF يدويًا (نسخة مبسطة)
        if (typeof Peer === 'undefined') {
            // انتظر تحميل simple-peer
            setTimeout(initP2PCF, 500);
            return;
        }
        
        statusDiv.innerHTML = `🟢 جاري البحث عن أجهزة أخرى في غرفة: ${currentRoom}...`;
        
        // إنشاء اتصال WebRTC مباشر
        startDirectSignaling();
    }
    
    function startDirectSignaling() {
        // استخدام localStorage + BroadcastChannel + رمز الغرفة
        // هذا الحل يعمل بين أي أجهزة تفتح نفس الرابط مع نفس ?room=xxx
        
        const urlRoom = new URLSearchParams(window.location.search).get('room');
        if (urlRoom) {
            currentRoom = urlRoom;
            roomIdInput.value = currentRoom;
        }
        
        statusDiv.innerHTML = `🎬 الغرفة: ${currentRoom}<br>📱 معرف جهازك: ${myClientId}<br>⏳ انتظر الجهة الأخرى تدخل نفس الغرفة...`;
        
        // تخزين هويتنا في localStorage للغرفة
        const storageKey = `p2p_room_${currentRoom}_peers`;
        let peersList = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (!peersList.includes(myClientId)) {
            peersList.push(myClientId);
            localStorage.setItem(storageKey, JSON.stringify(peersList));
        }
        
        // عرض عدد الأجهزة المتصلة
        peerCountSpan.textContent = `👥 ${peersList.length} متصل`;
        
        // الاستماع للتغييرات في localStorage (لاكتشاف الأجهزة الجديدة)
        window.addEventListener('storage', (e) => {
            if (e.key === storageKey) {
                const newList = JSON.parse(e.newValue || '[]');
                peerCountSpan.textContent = `👥 ${newList.length} متصل`;
                
                // إذا ظهر جهاز جديد، نرسل له أمر مزامنة تلقائي عند الحاجة
                if (newList.length > 1 && !isSyncing) {
                    statusDiv.innerHTML = `✅ تم اكتشاف ${newList.length} أجهزة في الغرفة! اضغط "بث فوري" لمزامنة الجميع`;
                }
            }
        });
        
        // الاستماع لأوامر البث
        const commandKey = `p2p_room_${currentRoom}_command`;
        window.addEventListener('storage', (e) => {
            if (e.key === commandKey && e.newValue) {
                try {
                    const command = JSON.parse(e.newValue);
                    const now = Date.now();
                    // قبول الأوامر التي تم إرسالها خلال آخر ثانيتين
                    if (now - command.timestamp < 2000) {
                        executeSync(command.targetTime);
                    }
                } catch(e) {}
            }
        });
        
        statusDiv.innerHTML = `✅ جاهز! الغرفة: ${currentRoom}<br>👥 الأجهزة المتصلة: ${peersList.length}<br>⚡ اضغط "بث فوري" لمزامنة الجميع`;
    }
    
    // إرسال أمر البث لجميع الأجهزة
    function broadcastSync(targetTime) {
        const commandKey = `p2p_room_${currentRoom}_command`;
        const command = {
            targetTime: targetTime,
            timestamp: Date.now(),
            sender: myClientId
        };
        localStorage.setItem(commandKey, JSON.stringify(command));
        statusDiv.innerHTML = `📡 تم إرسال أمر البث! جميع الأجهزة ستبدأ الآن...`;
        setTimeout(() => {
            statusDiv.innerHTML = `✅ جاهز! الغرفة: ${currentRoom} | الأجهزة: ${JSON.parse(localStorage.getItem(`p2p_room_${currentRoom}_peers`) || '[]').length}`;
        }, 2000);
    }
    
    // تنفيذ المزامنة فوراً
    function executeSync(targetTime) {
        if (!video.src || !video.duration) return;
        
        // إلغاء أي مؤقت سابق
        if (syncTimer) clearTimeout(syncTimer);
        
        // قفز إلى الوقت المطلوب
        if (targetTime <= video.duration) {
            video.currentTime = targetTime;
        } else {
            video.currentTime = video.duration;
        }
        
        // تشغيل الفيديو فوراً
        video.play().catch(e => console.log('play blocked'));
        
        // تأثير بصري سريع
        syncBtn.style.transform = 'scale(1.2)';
        setTimeout(() => syncBtn.style.transform = '', 200);
        
        statusDiv.innerHTML = `⚡ تمت المزامنة! التشغيل من ${formatTime(targetTime)}`;
        setTimeout(() => {
            const peersCount = JSON.parse(localStorage.getItem(`p2p_room_${currentRoom}_peers`) || '[]').length;
            statusDiv.innerHTML = `✅ جاهز! الغرفة: ${currentRoom} | الأجهزة: ${peersCount}`;
        }, 2000);
    }
    
    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        const ms = Math.floor((seconds % 1) * 1000);
        return `${mins}:${secs.toString().padStart(2,'0')}.${ms.toString().padStart(3,'0')}`;
    }
    
    // ========== أزرار التحكم ==========
    playBtn.onclick = () => { if(video.src) video.play(); };
    pauseBtn.onclick = () => { if(video.src) video.pause(); };
    
    // زر البث الفوري
    syncBtn.onclick = () => {
        if (!video.src || !video.duration) {
            statusDiv.innerHTML = '⚠️ الرجاء رفع فيديو أولاً';
            return;
        }
        const currentTime = video.currentTime;
        broadcastSync(currentTime);
        // تنفيذ المزامنة محلياً أيضاً
        executeSync(currentTime);
    };
    
    // رفع الفيديو
    uploadBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (file && file.type.startsWith('video/')) {
            const url = URL.createObjectURL(file);
            video.src = url;
            video.load();
            statusDiv.innerHTML = `📹 تم رفع الفيديو: ${file.name}`;
            video.onloadedmetadata = () => {
                statusDiv.innerHTML = `✅ فيديو جاهز! اضغط "بث فوري" لمزامنة الجميع`;
            };
        }
    };
    
    // تغيير الغرفة
    joinRoomBtn.onclick = () => {
        const newRoom = roomIdInput.value.trim();
        if (newRoom && newRoom !== currentRoom) {
            currentRoom = newRoom;
            // تحديث الرابط بدون إعادة تحميل الصفحة
            const url = new URL(window.location.href);
            url.searchParams.set('room', currentRoom);
            window.history.pushState({}, '', url);
            // إعادة تهيئة الاتصال
            startDirectSignaling();
        }
    };
    
    // بدء التشغيل
    startDirectSignaling();
    
    // إضافة مستمع للصفحة لتنظيف البيانات عند المغادرة
    window.addEventListener('beforeunload', () => {
        const storageKey = `p2p_room_${currentRoom}_peers`;
        let peersList = JSON.parse(localStorage.getItem(storageKey) || '[]');
        peersList = peersList.filter(id => id !== myClientId);
        localStorage.setItem(storageKey, JSON.stringify(peersList));
    });
</script>
</body>
</html>
